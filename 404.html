<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0099D8">
  <title>الصفحة غير موجودة | أمواج للسياحة</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,"Tahoma",sans-serif;background:#061522;color:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,rgba(0,153,216,.28),transparent 35%),linear-gradient(145deg,#061522,#0b2235)}
    main{width:min(620px,100%);text-align:center;padding:48px 28px;border:1px solid rgba(148,163,184,.25);border-radius:28px;background:rgba(8,24,38,.86);box-shadow:0 24px 80px rgba(0,0,0,.25)}
    .logo{width:82px;height:82px;object-fit:contain;margin:0 auto 18px;filter:drop-shadow(0 8px 18px rgba(0,153,216,.3))}.code{font-size:clamp(4rem,16vw,8rem);line-height:.9;color:#20b6e9;font-weight:900;margin:0}.eyebrow{color:#7dd3fc;font-weight:800;letter-spacing:.08em;margin:22px 0 10px}.title{font-size:clamp(1.45rem,4vw,2.25rem);margin:0 0 12px}.copy{color:#cbd5e1;line-height:1.8;margin:0 auto 28px;max-width:460px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.actions a{display:inline-flex;align-items:center;justify-content:center;min-width:150px;padding:13px 20px;border-radius:14px;text-decoration:none;font-weight:800}.primary{background:#0099d8;color:white}.secondary{border:1px solid rgba(125,211,252,.45);color:#bae6fd}.credit{margin-top:32px;color:#94a3b8;font-size:.8rem}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo.png" alt="شعار أمواج للسياحة">
    <p class="code" aria-hidden="true">404</p>
    <p class="eyebrow">AMWAJ TRAVEL &amp; TOURISM</p>
    <h1 class="title">الصفحة غير موجودة</h1>
    <p class="copy">يبدو أن الرابط الذي فتحته غير متاح أو تم نقله. يمكنك العودة إلى الصفحة الرئيسية أو استكشاف مدونة أمواج.</p>
    <nav class="actions" aria-label="روابط التنقل">
      <a class="primary" href="/">العودة للرئيسية</a>
      <a class="secondary" href="/blog/">زيارة المدونة</a>
    </nav>
    <p class="credit">Developed by YOMNA ELHAMAMSY</p>
  </main>
</body>
</html>
